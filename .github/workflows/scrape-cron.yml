name: Scrape Tee Times (Every 4h)

# Vercel Hobby plan은 cron을 하루 1회로 제한해서 기존 vercel.json의 시간당 cron이
# 실제로는 거의 동작하지 않는다. GitHub Actions cron으로 대체해 하루 6회(4시간 간격) 실행한다.
# Hobby 한도·Actions 빌링 부담을 낮추기 위해 시간당 → 4시간 간격으로 조정 (2026-04-19).
#
# 필수 repo secrets:
#   - APP_URL      : 배포 URL (예: https://golf-next.vercel.app)
#   - CRON_SECRET  : /api/scrape/cron 엔드포인트 Bearer 토큰 (Vercel env와 동일)

on:
  schedule:
    - cron: '0 */4 * * *' # 4시간마다 정각 (UTC): 00, 04, 08, 12, 16, 20 = KST 09, 13, 17, 21, 01, 05
  workflow_dispatch:
    # 필요 시 Actions 탭에서 수동 실행

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secrets
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL or CRON_SECRET secret is missing"
            exit 1
          fi

      - name: Call /api/scrape/cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          echo "Calling $APP_URL/api/scrape/cron"
          response=$(curl -sSL \
            --max-time 300 \
            --fail-with-body \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json" \
            -w "\nHTTP_STATUS:%{http_code}" \
            "$APP_URL/api/scrape/cron")
          status=$(echo "$response" | grep "^HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '$d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::scrape/cron returned non-200 status: $status"
            exit 1
          fi
