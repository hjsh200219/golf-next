name: Scrape OneTheClub Home (Hourly)

# 이 저장소에 남은 유일한 GitHub Actions 워크플로다. leftover 아니므로 삭제 금지.
# (중복이던 scrape-cron.yml은 2026-08-07 제거 — Vercel cron이 대체)
#
# 백업 러너. 옛 "Vercel write-loss 1~15%"의 원인은 회원 계정 단일 세션이었다 —
# 날짜별 함수가 동시에 로그인해 서로 세션을 밀어냈다. 2026-10-17부터 Vercel이
# onetheclub 날짜를 직렬 dispatch하므로 주 소스는 Vercel cron이고, 이 러너는
# GitHub 스케줄 누락(2~5시간 공백 관측) 때문에 보조로만 남긴다.
# 상세: docs/DEPLOY_CRON_TELEGRAM.md §4
#
# 주의: 듄스는 onetheclub 본진이 아니다(과거 주석 오기). 라비에벨CC 듄스=laviebell,
# 오렌지듄스영종GC=orangedunesyj — 별도 스크래퍼, Vercel cron이 담당.
#
# 필수 repo secrets:
#   - GOLF_LOGIN_ID, GOLF_LOGIN_PW (필수)
#   - GOLF_LOGIN_ID2, GOLF_LOGIN_EMAIL, GOLF_LOGIN_PW1~5, GOLF_LOGIN_NAME, GOLF_LOGIN_MOBILE
#   - ONETHECLUB_MEMBER_ID
#   - NEXT_PUBLIC_SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY

on:
  schedule:
    # 정시 30분에 실행 (기존 scrape-cron 워크플로의 정각과 분산)
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Run onetheclub scraper (D+1 ~ D+7)
        env:
          GOLF_LOGIN_ID: ${{ secrets.GOLF_LOGIN_ID }}
          GOLF_LOGIN_ID2: ${{ secrets.GOLF_LOGIN_ID2 }}
          GOLF_LOGIN_EMAIL: ${{ secrets.GOLF_LOGIN_EMAIL }}
          GOLF_LOGIN_PW: ${{ secrets.GOLF_LOGIN_PW }}
          GOLF_LOGIN_PW1: ${{ secrets.GOLF_LOGIN_PW1 }}
          GOLF_LOGIN_PW2: ${{ secrets.GOLF_LOGIN_PW2 }}
          GOLF_LOGIN_PW3: ${{ secrets.GOLF_LOGIN_PW3 }}
          GOLF_LOGIN_PW4: ${{ secrets.GOLF_LOGIN_PW4 }}
          GOLF_LOGIN_PW5: ${{ secrets.GOLF_LOGIN_PW5 }}
          GOLF_LOGIN_NAME: ${{ secrets.GOLF_LOGIN_NAME }}
          GOLF_LOGIN_MOBILE: ${{ secrets.GOLF_LOGIN_MOBILE }}
          ONETHECLUB_MEMBER_ID: ${{ secrets.ONETHECLUB_MEMBER_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/scrape-onetheclub.ts --days 7 --start 1
